name: refresh
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  issues:
    types: [opened]
concurrency: registry
permissions:
  contents: write
  issues: write
jobs:
  refresh:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'listing')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
      BODY: ${{ github.event.issue.body }}
    steps:
      - uses: actions/checkout@v4
      - name: Read every node
        if: github.event_name != 'issues'
        run: python3 scripts/refresh.py
      - name: Read the requested node
        id: request
        if: github.event_name == 'issues'
        run: |
          printf '%s' "$BODY" > "$RUNNER_TEMP/request"
          if python3 scripts/refresh.py --request "$RUNNER_TEMP/request"; then echo reason=completed; else echo "reason=not planned"; fi >> "$GITHUB_OUTPUT"
      - name: Commit
        run: |
          python3 scripts/validate.py
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Refresh from each node's discover"
          git push
      - name: Reply
        if: github.event_name == 'issues'
        run: gh issue close "$ISSUE" --reason "${{ steps.request.outputs.reason }}" --comment "$(cat "$RUNNER_TEMP/request")"
